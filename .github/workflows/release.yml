name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test
        run: |
          $tools = & ./scripts/Download-Tools.ps1
          $process = Start-Process -FilePath $tools.AutoHotkey -ArgumentList '/ErrorStdOut tests/Tests.ahk' -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Core tests failed: $($process.ExitCode)"
          }

      - name: Package
        run: ./scripts/Package.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/MacKeys.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/MacKeys.zip --verify-tag --title $env:GITHUB_REF_NAME --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish release.'
          }
